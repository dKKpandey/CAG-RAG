[project]
name = "cag-rag-service"
version = "0.1.0"
description = "Reference CAG + RAG architecture: Redis-backed cached context, Qdrant-backed live retrieval, provider-agnostic LLM/embeddings."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long descriptive test names and inline assertions read better unwrapped.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a real Redis/Qdrant (see tests/integration/README.md)"]
addopts = "-m 'not integration'"
