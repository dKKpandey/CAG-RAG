<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 1300" role="img" aria-label="Operational architecture of the CAG+RAG reference service: a client calls the FastAPI app over HTTPS; the app's pipeline reads cached context from Redis and live context from Qdrant (via an embedding provider), then calls an LLM provider to generate the answer. Two offline CLI scripts, run manually or on a schedule, preload Redis from cold sources and ingest hot sources into Qdrant.">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E22CE"/></marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker>
    <marker id="aIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4338CA"/></marker>
    <marker id="aInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E293B"/></marker>
  </defs>

  <rect x="0" y="0" width="1650" height="1300" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="825" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1E293B">CAG + RAG &#8212; Operational Architecture</text>
  <text x="825" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5" fill="#64748B">Solid arrows = live request path  -  Dashed arrows = offline / admin jobs</text>

  <!-- Client -->
  <rect x="600" y="100" width="200" height="80" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="620" y="118" width="22" height="15" rx="2" fill="none" stroke="#1E293B" stroke-width="1.3"/>
  <line x1="631" y1="133" x2="631" y2="138" stroke="#1E293B" stroke-width="1.3"/>
  <text x="700" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Client</text>
  <text x="700" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#64748B">curl / frontend</text>

  <line x1="700" y1="180" x2="700" y2="248" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <circle cx="700" cy="214" r="13" fill="#2563EB"/>
  <text x="700" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="718" y="210" font-family="ui-monospace, monospace" font-size="11" fill="#1E293B">HTTPS :8000</text>
  <text x="718" y="224" font-family="Arial, sans-serif" font-size="10" fill="#64748B">Header: X-API-Key</text>

  <!-- Compose boundary -->
  <rect x="40" y="255" width="1260" height="770" rx="20" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="60" y="243" width="320" height="26" rx="13" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/>
  <text x="220" y="261" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#64748B">docker-compose.yml &#183; cag-rag-stack</text>

  <!-- App container -->
  <rect x="70" y="295" width="850" height="650" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="90" y="325" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563EB">app</text>
  <text x="90" y="341" font-family="ui-monospace, monospace" font-size="10.5" fill="#64748B">FastAPI &#183; Dockerfile</text>

  <!-- Router pills -->
  <rect x="100" y="363" width="190" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="195" y="384" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#1E293B">GET /health</text>
  <rect x="310" y="363" width="200" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="410" y="384" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#1E293B">POST /v1/query</text>
  <rect x="100" y="405" width="230" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="215" y="426" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#1E293B">POST /v1/documents</text>
  <rect x="350" y="405" width="290" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="495" y="426" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#1E293B">POST /v1/admin/preload-cache</text>

  <line x1="490" y1="439" x2="490" y2="460" stroke="#2563EB" stroke-width="2" marker-end="url(#aBlue)"/>

  <!-- Security gate -->
  <rect x="100" y="460" width="740" height="36" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.3"/>
  <text x="470" y="483" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#7C4A03">require_api_key()  -  checked on every route except /health</text>

  <line x1="490" y1="496" x2="490" y2="518" stroke="#2563EB" stroke-width="2" marker-end="url(#aBlue)"/>

  <!-- Pipeline -->
  <rect x="100" y="518" width="740" height="76" rx="12" fill="#C7D7FB" stroke="#2563EB" stroke-width="1.5"/>
  <text x="470" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1E3A8A">CagRagPipeline</text>
  <text x="470" y="570" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#1E3A8A">app/pipeline/orchestrator.py &#8212; answer(query)</text>
  <text x="470" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#334155">cached + retrieved &#8594; compose_messages() &#8594; generate()</text>

  <!-- Pipeline -> CacheStore -->
  <path d="M250,594 L250,610" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#aBlue)"/>
  <!-- Pipeline -> VectorStore (right margin bus, one clean crossing with CacheStore->Redis) -->
  <path d="M840,555 C 870,565 885,580 885,610 L885,752 C 885,765 875,768 860,768" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#aBlue)"/>
  <!-- Pipeline -> LLMProvider (left margin bus, no crossings) -->
  <path d="M100,555 C 70,565 55,580 55,610 L55,925 C 55,938 65,940 80,940" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#aBlue)"/>

  <!-- CacheStore -->
  <rect x="100" y="610" width="740" height="85" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="130" y="641" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#DC2626">CacheStore</text>
  <text x="130" y="658" font-family="ui-monospace, monospace" font-size="10.5" fill="#64748B">RedisCacheStore &#8212; app/cache/redis_store.py</text>
  <text x="130" y="674" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">get_cached_context() / preload_cold_sources()</text>

  <!-- VectorStore -->
  <rect x="100" y="710" width="740" height="85" rx="12" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1.5"/>
  <text x="130" y="741" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#7E22CE">VectorStore</text>
  <text x="130" y="758" font-family="ui-monospace, monospace" font-size="10.5" fill="#64748B">QdrantStore &#8212; app/vectorstore/qdrant_store.py</text>
  <text x="130" y="774" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">similarity_search() / upsert()</text>

  <!-- VectorStore -> EmbeddingProvider -->
  <line x1="290" y1="795" x2="290" y2="810" stroke="#7E22CE" stroke-width="2" marker-end="url(#aPurple)"/>

  <!-- Row 3: EmbeddingProvider + LLMProvider -->
  <rect x="100" y="810" width="380" height="85" rx="12" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="130" y="838" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0D9488">EmbeddingProvider</text>
  <text x="130" y="855" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">VoyageEmbeddingProvider /</text>
  <text x="130" y="868" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">OpenAIEmbeddingProvider</text>
  <text x="130" y="884" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B">embed_query() / embed_documents()</text>

  <rect x="500" y="810" width="340" height="85" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5"/>
  <text x="530" y="838" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4338CA">LLMProvider</text>
  <text x="530" y="855" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">AnthropicProvider /</text>
  <text x="530" y="868" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">OpenAIProvider</text>
  <text x="530" y="884" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B">generate(messages)</text>

  <!-- Redis / Qdrant containers -->
  <rect x="970" y="610" width="280" height="85" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1000" y="638" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#991B1B">redis:7-alpine</text>
  <text x="1000" y="655" font-family="ui-monospace, monospace" font-size="10.5" fill="#7F1D1D">:6379 &#8212; CAG cache</text>
  <text x="1000" y="671" font-family="ui-monospace, monospace" font-size="9.5" fill="#7F1D1D">volume: redis_data</text>

  <rect x="970" y="710" width="280" height="85" rx="12" fill="#F3E8FF" stroke="#7E22CE" stroke-width="1.5"/>
  <text x="1000" y="738" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#6B21A8">qdrant:v1.9.2</text>
  <text x="1000" y="755" font-family="ui-monospace, monospace" font-size="10.5" fill="#581C87">:6333 &#8212; RAG vectors</text>
  <text x="1000" y="771" font-family="ui-monospace, monospace" font-size="9.5" fill="#581C87">volume: qdrant_data</text>

  <line x1="840" y1="652" x2="968" y2="652" stroke="#DC2626" stroke-width="2.2" marker-end="url(#aRed)"/>
  <circle cx="905" cy="652" r="13" fill="#DC2626"/>
  <text x="905" y="656" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#fff">2</text>

  <line x1="840" y1="752" x2="968" y2="752" stroke="#7E22CE" stroke-width="2.2" marker-end="url(#aPurple)"/>
  <circle cx="905" cy="752" r="13" fill="#7E22CE"/>
  <text x="905" y="756" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#fff">3</text>

  <!-- Offline ops scripts (run via: docker compose exec app python -m ...) -->
  <rect x="1310" y="595" width="280" height="90" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="1340" y="622" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700" fill="#7C4A03">preload_cache.py</text>
  <text x="1340" y="638" font-family="Arial, sans-serif" font-size="9.5" fill="#7C4A03">reads data/cold_sources/*.md</text>
  <text x="1340" y="652" font-family="ui-monospace, monospace" font-size="9" fill="#7C4A03">docker compose exec app python -m</text>
  <text x="1340" y="664" font-family="ui-monospace, monospace" font-size="9" fill="#7C4A03">app.scripts.preload_cache</text>
  <text x="1340" y="678" font-family="Arial, sans-serif" font-size="9" font-style="italic" fill="#92400E">run once, or when cold sources change</text>

  <path d="M1308,660 C 1270,660 1260,655 1252,648" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#aRed)"/>

  <rect x="1310" y="745" width="280" height="90" rx="10" fill="#FBE4EF" stroke="#7E22CE" stroke-width="1.5"/>
  <text x="1340" y="772" font-family="ui-monospace, monospace" font-size="13.5" font-weight="700" fill="#6B21A8">ingest_documents.py</text>
  <text x="1340" y="788" font-family="Arial, sans-serif" font-size="9.5" fill="#6B21A8">reads data/hot_sources/*.md</text>
  <text x="1340" y="802" font-family="ui-monospace, monospace" font-size="9" fill="#6B21A8">docker compose exec app python -m</text>
  <text x="1340" y="814" font-family="ui-monospace, monospace" font-size="9" fill="#6B21A8">app.scripts.ingest_documents</text>
  <text x="1340" y="828" font-family="Arial, sans-serif" font-size="9" font-style="italic" fill="#86198F">run whenever hot sources change</text>

  <path d="M1308,795 C 1270,795 1260,790 1252,782" fill="none" stroke="#7E22CE" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#aPurple)"/>

  <!-- EmbeddingProvider / LLMProvider -> external SaaS -->
  <line x1="290" y1="895" x2="290" y2="1030" stroke="#0D9488" stroke-width="2.2" marker-end="url(#aTeal)"/>
  <circle cx="290" cy="965" r="13" fill="#0D9488"/>
  <text x="290" y="969" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#fff">4</text>

  <line x1="690" y1="895" x2="690" y2="1030" stroke="#4338CA" stroke-width="2.2" marker-end="url(#aIndigo)"/>
  <circle cx="690" cy="965" r="13" fill="#4338CA"/>
  <text x="690" y="969" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#fff">5</text>

  <!-- External SaaS row -->
  <text x="825" y="1055" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748B">EXTERNAL &#8212; OUTSIDE THE DOCKER NETWORK</text>

  <rect x="110" y="1065" width="360" height="110" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
  <text x="290" y="1098" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#115E59">Embedding Provider (SaaS)</text>
  <text x="290" y="1118" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#115E59">Voyage AI  /  OpenAI Embeddings</text>
  <text x="290" y="1140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0F766E">embed_query() for retrieval, embed_documents() for ingestion</text>
  <text x="290" y="1156" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0F766E">dimension must match QDRANT_COLLECTION&#8217;s vector size</text>

  <rect x="510" y="1065" width="360" height="110" rx="12" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
  <text x="690" y="1098" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3730A3">LLM Provider (SaaS)</text>
  <text x="690" y="1118" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#3730A3">Anthropic Claude  /  OpenAI GPT</text>
  <text x="690" y="1140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4338CA">cache_control marks the cached block &#8212;</text>
  <text x="690" y="1156" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4338CA">reused across requests instead of reprocessed</text>

  <!-- Response back to client -->
  <circle cx="980" cy="1093" r="13" fill="#1E293B"/>
  <text x="980" y="1097" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#fff">6</text>
  <text x="1000" y="1090" font-family="Arial, sans-serif" font-size="11" fill="#1E293B">answer + sources +</text>
  <text x="1000" y="1104" font-family="Arial, sans-serif" font-size="11" fill="#1E293B">cache_hit + usage &#8594; back to Client</text>

  <!-- Legend -->
  <rect x="40" y="1210" width="1260" height="60" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <line x1="65" y1="1232" x2="105" y2="1232" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="115" y="1237" font-family="Arial, sans-serif" font-size="11" fill="#1E293B">live request call</text>
  <line x1="280" y1="1232" x2="320" y2="1232" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#aRed)"/>
  <text x="330" y="1237" font-family="Arial, sans-serif" font-size="11" fill="#1E293B">offline / admin job (manual or scheduled)</text>
  <text x="65" y="1258" font-family="Arial, sans-serif" font-size="10.5" fill="#64748B">Numbers trace one live query end-to-end: 1 request &#8594; 2 cache lookup &#8594; 3 vector search &#8594; 4 embed &#8594; 5 generate &#8594; 6 response.</text>
</svg>
