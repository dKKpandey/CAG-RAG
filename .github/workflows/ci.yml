name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v

  integration:
    runs-on: ubuntu-latest
    # Real Redis and real Qdrant, no mocks. Embeddings use
    # tests.fakes.FakeEmbeddingProvider, so no paid API key is needed to
    # prove this service actually talks to both real datastores correctly.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        # Keep in sync with docker-compose.yml - must stay >=1.10 to
        # support the Query API qdrant-client 1.19.x uses by default.
        image: qdrant/qdrant:v1.19.2
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v -m integration
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
          TEST_QDRANT_URL: http://localhost:6333
