version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]

  qdrant:
    # Must stay >=1.10: that's when Qdrant's server-side Query API
    # (/points/query) shipped, which qdrant-client 1.19.x uses by default.
    # An older server here 404s on every search - caught by the real
    # Qdrant integration tests in CI, not by anything that runs offline.
    image: qdrant/qdrant:v1.19.2
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  app:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on: [redis, qdrant]
    ports: ["8000:8000"]

volumes:
  redis_data:
  qdrant_data:
